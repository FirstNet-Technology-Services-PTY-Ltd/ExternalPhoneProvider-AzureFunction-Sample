name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  epp-setup:
    name: EPP setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test script launcher without network access
        shell: pwsh
        run: ./setup/tests/Launcher.Tests.ps1
      - name: Test Azure account selection without Azure access
        shell: pwsh
        run: ./setup/tests/Accounts.Tests.ps1
      - name: Test certificate setup without Azure access
        shell: pwsh
        run: ./setup/tests/Certificates.Tests.ps1
      - name: Test CLI-backed Graph operations without Azure access
        shell: pwsh
        run: ./setup/tests/Graph.Tests.ps1
      - name: Test application provider configuration without Azure access
        shell: pwsh
        run: ./setup/tests/ProviderConfiguration.Tests.ps1
      - name: Test provider setup without Azure access
        shell: pwsh
        run: ./setup/tests/Providers.Tests.ps1
      - name: Test package and checksum validation without network access
        shell: pwsh
        run: ./setup/tests/Packages.Tests.ps1
      - name: Test application and region selection without Azure access
        shell: pwsh
        run: ./setup/tests/Selections.Tests.ps1
      - name: Test new application creation without Azure access
        shell: pwsh
        run: ./setup/tests/Applications.Tests.ps1
      - name: Test deployment progress without Azure access
        shell: pwsh
        run: ./setup/tests/Progress.Tests.ps1
      - name: Test FirstNet enablement logic without Azure access
        shell: pwsh
        run: ./setup/tests/FirstNet.Tests.ps1
      - name: Compile Bicep without deploying
        shell: pwsh
        run: |
          az bicep install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          az bicep build --file (Join-Path $env:GITHUB_WORKSPACE 'setup/infra/main.bicep') --outfile (Join-Path $env:RUNNER_TEMP 'epp-main.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test service plans without Azure access
        shell: pwsh
        run: ./setup/tests/ServicePlans.Tests.ps1 -TemplatePath (Join-Path $env:RUNNER_TEMP 'epp-main.json')

  javascript:
    name: JavaScript (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  dotnet:
    name: C# (.NET isolated)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build
      - run: dotnet test tests

  python:
    name: Python (v2 model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests
